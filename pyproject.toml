[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spw"
version = "0.1.0"
description = "Service Plan Writer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
spw = "spw.cli:main"

[tool.setuptools.packages.find]
include = ["spw", "spw.*", "web", "web.*"]
