[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spw"
version = "0.1.0"
description = "Service Plan Writer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
sop = [
  "anthropic>=1.8,<2",
]
ingest = [
  "pypdf>=4",
  "pandas>=2",
  "openpyxl>=3.1",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
spw = "spw.cli:main"

[tool.setuptools.packages.find]
include = ["spw", "spw.*", "web", "web.*"]

[tool.setuptools.package-data]
spw = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
